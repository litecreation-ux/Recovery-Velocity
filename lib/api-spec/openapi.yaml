openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Recovery Velocity Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parishes
    description: Parish data
  - name: reviews
    description: Human review gate
  - name: agents
    description: Agent statuses
  - name: audit
    description: Audit log
  - name: dashboard
    description: Dashboard aggregates
  - name: tasks
    description: Task dispatch and completion
  - name: resources
    description: Community Resource Exchange
  - name: risk
    description: Global, source-aware resilience intelligence
  - name: unified-command
    description: Durable inter-agency incident coordination
  - name: storage
    description: Moderated citizen-report photo storage
  - name: communications
    description: Resilient operational communications and radio traffic

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /parishes:
    get:
      operationId: listParishes
      tags: [parishes]
      summary: List all 14 parishes with readiness scores
      responses:
        "200":
          description: Parish list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parish"

  /parishes/{parishId}:
    get:
      operationId: getParish
      tags: [parishes]
      summary: Get a single parish detail
      parameters:
        - in: path
          name: parishId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parish detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParishDetail"
        "404":
          description: Not found

  /parishes/{parishId}/historical-events:
    get:
      operationId: getParishHistoricalEvents
      tags: [parishes]
      summary: Historical hurricane events relevant to a parish
      parameters:
        - in: path
          name: parishId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Historical events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HurricaneEvent"
        "404":
          description: Not found

  /parishes/{parishId}/citizen-reports:
    get:
      operationId: getParishCitizenReports
      tags: [parishes]
      summary: Field reports from community members for a parish
      parameters:
        - in: path
          name: parishId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Citizen reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenReport"
        "404":
          description: Not found

    post:
      operationId: submitCitizenReport
      tags: [parishes]
      summary: Submit a new citizen field report
      parameters:
        - in: path
          name: parishId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenReport"
        "400":
          description: Bad request

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a short-lived upload URL for citizen-report photo evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Unsupported image metadata
        "429":
          description: Too many upload requests

  /parishes/{parishId}/resources:
    get:
      operationId: getParishResources
      tags: [parishes]
      summary: Resource status indicators for a parish (fuel, water, medical)
      parameters:
        - in: path
          name: parishId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParishResources"
        "404":
          description: Not found

  /parishes/{parishId}/infrastructure:
    get:
      operationId: getParishInfrastructure
      tags: [parishes]
      summary: List parish infrastructure references and partner-reported availability
      parameters:
        - in: path
          name: parishId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parish infrastructure sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureOverview"
        "404":
          description: Parish not found

  /parishes/{parishId}/infrastructure/{category}:
    get:
      operationId: getParishInfrastructurePlaces
      tags: [parishes]
      summary: Load public Google place listings for a parish infrastructure category
      parameters:
        - in: path
          name: parishId
          required: true
          schema:
            type: string
        - in: path
          name: category
          required: true
          schema:
            $ref: "#/components/schemas/InfrastructureCategory"
      responses:
        "200":
          description: Parish infrastructure sources with Google place listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureOverview"
        "400":
          description: Unknown infrastructure category
        "404":
          description: Parish not found

  /parishes/{parishId}/recovery-forecast/{stormScenario}:
    get:
      operationId: getParishRecoveryForecast
      tags: [parishes]
      summary: Scenario-based recovery planning forecast for a parish
      parameters:
        - in: path
          name: parishId
          required: true
          schema:
            type: string
        - in: path
          name: stormScenario
          required: true
          schema:
            $ref: "#/components/schemas/StormScenario"
      responses:
        "200":
          description: Recovery forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryForecast"
        "404":
          description: Not found

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Platform-wide summary stats and readiness overview
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /risk/countries:
    get:
      operationId: listRiskCountries
      tags: [risk]
      summary: List countries supported by the global risk intelligence view
      responses:
        "200":
          description: Supported countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskCountry"

  /risk/countries/{countryCode}/overview:
    get:
      operationId: getCountryRiskOverview
      tags: [risk]
      summary: Get source-labelled risk, phase, and resilience context for a country
      parameters:
        - in: path
          name: countryCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Country risk context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryRiskOverview"
        "404":
          description: Country is not supported

  /risk/countries/{countryCode}/business-continuity:
    get:
      operationId: getBusinessContinuity
      tags: [risk]
      summary: List essential service continuity updates for a country
      parameters:
        - in: path
          name: countryCode
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Business continuity context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessContinuityDirectory"
        "404":
          description: Country is not supported

  /review-items:
    get:
      operationId: listReviewItems
      tags: [reviews]
      summary: List items pending human review
      parameters:
        - in: query
          name: parishId
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Review items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewItem"

  /review-items/{id}:
    patch:
      operationId: updateReviewItem
      tags: [reviews]
      summary: Approve or reject a review item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewItemUpdate"
      responses:
        "200":
          description: Updated review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItem"
        "404":
          description: Not found

  /regional-aid/assess:
    post:
      operationId: assessRegionalAid
      tags: [reviews]
      summary: Prepare an evidence-backed regional aid draft for human review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegionalAidAssessmentInput"
      responses:
        "200":
          description: No draft was created because current evidence was insufficient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalAidAssessmentResponse"
        "201":
          description: Pending aid draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalAidAssessmentResponse"
        "400":
          description: Invalid parish
        "403":
          description: Operator is not authorized for this parish
        "409":
          description: A matching pending draft already exists
        "502":
          description: The AI provider returned an unusable draft

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all 7 agent statuses
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"

  /tasks/dispatch:
    post:
      operationId: dispatchTask
      tags: [tasks]
      summary: Coordinator dispatches an approved incident to a field officer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDispatchInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation error

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks, optionally filtered by officer
      parameters:
        - in: query
          name: officer
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Backward-compatible field submission that moves a task to pending verification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompleteInput"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found

  /tasks/{id}/start:
    post:
      operationId: startTask
      tags: [tasks]
      summary: Assigned field unit leader starts their task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskActorInput"
      responses:
        "200":
          description: Task started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Invalid transition or actor

  /tasks/{id}/submit:
    post:
      operationId: submitTask
      tags: [tasks]
      summary: Assigned field unit leader submits evidence for OPS verification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskSubmissionInput"
      responses:
        "200":
          description: Task submitted for verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Invalid transition or actor

  /tasks/{id}/verify:
    post:
      operationId: verifyTask
      tags: [tasks]
      summary: OPS Section Chief verifies submitted evidence and completes the task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskVerificationInput"
      responses:
        "200":
          description: Task verified and completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "409":
          description: Invalid transition or actor

  /resources/declare:
    post:
      operationId: declareResources
      tags: [resources]
      summary: Private sector organization declares available resources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceDeclarationInput"
      responses:
        "201":
          description: Declaration recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDeclaration"
        "400":
          description: Validation error

  /operator-authority:
    get:
      operationId: getOperatorAuthority
      tags: [resources]
      summary: Resolve the signed-in user's server-assigned operational role and parish scope
      responses:
        "200":
          description: Current operational authority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAuthority"

  /operator-invitations:
    get:
      operationId: listOperatorInvitations
      tags: [resources]
      summary: List demo Ops Section Chief invitations
      responses:
        "200":
          description: Pending demo invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorInvitation"
        "403":
          description: Only the Incident Commander may view invitations
    post:
      operationId: createOperatorInvitation
      tags: [resources]
      summary: Create a demo invitation for an Ops Section Chief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorInvitationInput"
      responses:
        "201":
          description: Demo invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorInvitation"
        "400":
          description: Invalid email or parish
        "403":
          description: Only the Incident Commander may create invitations
        "409":
          description: A pending invitation already exists for this email

  /resources/available:
    get:
      operationId: listResourceDeclarations
      tags: [resources]
      summary: List all current resource declarations
      responses:
        "200":
          description: All declarations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceDeclaration"

  /resources/summary:
    get:
      operationId: getResourceSummary
      tags: [resources]
      summary: Aggregated resource totals by category for coordinator panels
      responses:
        "200":
          description: Resource summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceSummary"

  /resources/operational:
    get:
      operationId: listResourceOperationalStatuses
      tags: [resources]
      summary: List declared, deployed, verified-available, and target quantities by compatible parish unit
      parameters:
        - in: query
          name: parishId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Operational resource statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceOperationalStatus"
        "404":
          description: Parish not found
    post:
      operationId: recordResourceOperations
      tags: [resources]
      summary: Record an authorized operational resource snapshot without changing partner declarations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceOperationalInput"
      responses:
        "201":
          description: Operational snapshot recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceOperationalStatus"
        "400":
          description: Validation error
        "403":
          description: Operational role required

  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit]
      summary: List audit log entries with parish context
      parameters:
        - in: query
          name: parishId
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  /unified-command/{workspaceId}:
    get:
      operationId: getUnifiedCommandWorkspace
      tags: [unified-command]
      summary: Get the current role-scoped Unified Command workspace
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedCommandWorkspace"
        "401":
          description: Authentication required
        "403":
          description: Workspace scope denied
        "404":
          description: Workspace not found
    post:
      operationId: applyUnifiedCommandAction
      tags: [unified-command]
      summary: Apply an authorized, audited workspace action
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnifiedCommandActionInput"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedCommandWorkspace"
        "400":
          description: Invalid action
        "401":
          description: Authentication required
        "403":
          description: Capability or scope denied
        "404":
          description: Workspace or record not found
        "409":
          description: Workspace changed concurrently; refresh before retrying

  /communications:
    get:
      operationId: listCommunications
      tags: [communications]
      summary: List operational communications in the caller's authorized scope
      parameters:
        - in: query
          name: priority
          required: false
          schema: { type: string, enum: [emergency, urgent, operational, information] }
        - in: query
          name: channel
          required: false
          schema: { type: string, enum: [app, radio, sms] }
        - in: query
          name: audience
          required: false
          schema: { $ref: "#/components/schemas/CommunicationAudience" }
      responses:
        "200":
          description: Communications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommunicationMessage" }
        "403": { description: Operational authority required }
    post:
      operationId: createCommunication
      tags: [communications]
      summary: Record a server-attributed operational communication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunicationMessageInput" }
      responses:
        "201":
          description: Communication recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationMessage" }
        "400": { description: Invalid input }
        "403": { description: Scope denied }

  /communications/{id}/acknowledgements:
    post:
      operationId: acknowledgeCommunication
      tags: [communications]
      summary: Acknowledge a communication once per authenticated operator
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Acknowledgement recorded or previously recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationAcknowledgement" }
        "403": { description: Scope denied }
        "404": { description: Communication not found }

  /communications/public-alerts:
    get:
      operationId: listPublicAlerts
      tags: [communications]
      summary: List published unexpired public alerts without authentication
      parameters:
        - in: query
          name: countryCode
          required: true
          schema: { type: string }
        - in: query
          name: parishId
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Published public alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicAlert" }

  /communications/public-alerts/pending:
    get:
      operationId: listPendingPublicAlerts
      tags: [communications]
      summary: List scoped public alerts pending approval for authorized approvers
      responses:
        "200":
          description: Pending public alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommunicationMessage" }
        "403": { description: Public alert approval authority required }

  /communications/{id}/public-alert-review:
    post:
      operationId: reviewPublicAlert
      tags: [communications]
      summary: Approve or reject a scoped pending public alert
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicAlertReviewInput" }
      responses:
        "200":
          description: Public alert reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationMessage" }
        "400": { description: Invalid public alert review }
        "403": { description: Public alert approval authority required }
        "404": { description: Public alert not found }

  /radio-traffic:
    get:
      operationId: listRadioTraffic
      tags: [communications]
      summary: List radio traffic in the caller's authorized scope
      parameters:
        - in: query
          name: priority
          required: false
          schema: { type: string, enum: [emergency, urgent, operational, information] }
      responses:
        "200":
          description: Radio traffic
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RadioTrafficLog" }
        "403": { description: Operational authority required }
    post:
      operationId: createRadioTraffic
      tags: [communications]
      summary: Record authenticated radio traffic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadioTrafficLogInput" }
      responses:
        "201":
          description: Radio traffic recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioTrafficLog" }
        "400": { description: Invalid input }
        "403": { description: Scope denied }

components:
  schemas:
    CommunicationMessage:
      type: object
      required: [id, clientId, body, priority, channel, deliveryState, audience, countryCode, parishId, senderUserId, senderName, publicStatus, expiresAt, approvedAt, approvedByName, rejectedAt, rejectedByName, rejectionReason, createdAt, updatedAt, acknowledgementCount, acknowledgedByCurrentUser]
      properties:
        id: { type: string }
        clientId: { type: string }
        body: { type: string }
        priority: { type: string, enum: [emergency, urgent, operational, information] }
        channel: { type: string, enum: [app, radio, sms] }
        deliveryState: { type: string, enum: [recorded, requested, delivered] }
        audience: { $ref: "#/components/schemas/CommunicationAudience" }
        countryCode: { type: string }
        parishId: { type: ["string", "null"] }
        senderUserId: { type: string }
        senderName: { type: string }
        publicStatus: { type: ["string", "null"], enum: [pending_approval, published, rejected, expired, null] }
        expiresAt: { type: ["string", "null"] }
        approvedAt: { type: ["string", "null"] }
        approvedByName: { type: ["string", "null"] }
        rejectedAt: { type: ["string", "null"] }
        rejectedByName: { type: ["string", "null"] }
        rejectionReason: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        acknowledgementCount: { type: number }
        acknowledgedByCurrentUser: { type: boolean }

    CommunicationMessageInput:
      type: object
      required: [clientId, body, priority, channel, audience, countryCode]
      properties:
        clientId: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 4000 }
        priority: { type: string, enum: [emergency, urgent, operational, information] }
        channel: { type: string, enum: [app, radio, sms] }
        audience: { $ref: "#/components/schemas/CommunicationAudience" }
